<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b3a2b">
  <meta name="description" content="Bodem, landvorm, natuur, reliëf en historische kaarten op je positie in het veld.">
  <title>Veldgis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Veldgis">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="app">
    <div id="map">
      <div id="crosshair" aria-hidden="true"></div>
      <div id="chip" class="chip" role="button" tabindex="0" aria-live="polite" hidden></div>
      <button id="btn-follow" class="round" aria-label="Volg mijn positie" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <button id="btn-full" class="round round-bottom" aria-label="Kaart schermvullend" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path class="ico-open" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
          <path class="ico-close" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
        </svg>
      </button>
    </div>

    <section id="controls">
      <div id="year-row" class="slider-row" hidden>
        <span id="year-label" class="big-value">1900</span>
        <input id="year" type="range" min="1815" max="2025" step="1" value="1900" aria-label="Jaar">
      </div>

      <div class="slider-row">
        <label for="relief" class="slider-label">Reliëf</label>
        <input id="relief" type="range" min="0" max="100" step="5" value="40">
        <span id="relief-value" class="pct">40%</span>
      </div>

      <div id="layers" role="radiogroup" aria-label="Kaartlaag">
        <button data-layer="topo" role="radio">Topo</button>
        <button data-layer="foto" role="radio">Luchtfoto</button>
        <button data-layer="tijd" role="radio">Tijdreis</button>
        <button data-layer="bodem" role="radio">Bodem</button>
        <button data-layer="geo" role="radio">Geomorf.</button>
        <button data-layer="brp" role="radio">Gewassen</button>
        <button data-layer="snl" role="radio">SNL</button>
        <button data-layer="flora" role="radio">Flora</button>
        <button data-layer="vogels" role="radio">Vogels</button>
      </div>

      <button id="btn-info" class="primary">Wat is hier?</button>
    </section>

    <section id="info" hidden>
      <div class="info-head">
        <h2 id="info-title">Wat is hier?</h2>
        <button id="btn-close" aria-label="Sluiten">✕</button>
      </div>
      <div id="info-body"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
